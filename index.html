<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desmond Williams</title>
  <meta name="description" content="Desmond Williams — site coming soon.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f5d8a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --fg: #ececec;
        --muted: #9a9a9a;
        --accent: #7fb0e0;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { text-align: center; max-width: 32rem; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.125rem; }
    .contact { margin-top: 2rem; font-size: 1rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>Desmond Williams</h1>
    <p>Site coming soon.</p>
    <p class="contact">
      <a href="mailto:contact@desmondwilliams.net">contact@desmondwilliams.net</a>
    </p>
  </main>
</body>
</html>
